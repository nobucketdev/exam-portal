<!-- test.html -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Làm bài kiểm tra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .question { margin-bottom: 1.5rem; }
    .hidden { display: none; }
  </style>
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4 text-center">📝 Bài Kiểm Tra</h1>

    <!-- Thông tin sinh viên -->
    <div id="studentForm">
      <div class="mb-3">
        <input class="form-control" id="studentName" placeholder="Họ tên sinh viên">
      </div>
      <div class="mb-3">
        <input class="form-control" id="studentID" placeholder="Mã số sinh viên">
      </div>
      <div class="mb-3">
        <input class="form-control" id="studentEmail" placeholder="Email">
      </div>
      <div class="mb-3">
        <input class="form-control" id="examKey" placeholder="Mã bài kiểm tra (key)">
      </div>
      <button class="btn btn-primary" onclick="startExam()">Bắt đầu làm bài</button>
    </div>

    <!-- Nội dung bài kiểm tra -->
    <form id="examForm" class="hidden">
      <div id="questionList"></div>
      <button type="submit" class="btn btn-success">Nộp bài</button>
    </form>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const examFile = params.get('exam');
    let examData = null;

    async function loadExam() {
      const res = await fetch(`exams/${examFile}`);
      examData = await res.json();
    }

    function startExam() {
      const name = document.getElementById('studentName').value.trim();
      const id = document.getElementById('studentID').value.trim();
      const email = document.getElementById('studentEmail').value.trim();
      const key = document.getElementById('examKey').value.trim();

      if (!name || !id || !email || !key) return alert('Vui lòng điền đầy đủ thông tin.');
      if (key !== examData.key) return alert('Sai mã key của bài kiểm tra.');

      document.getElementById('studentForm').classList.add('hidden');
      document.getElementById('examForm').classList.remove('hidden');

      renderQuestions();
    }

    function renderQuestions() {
      const list = document.getElementById('questionList');
      list.innerHTML = '';

      examData.questions.forEach((q, i) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question';
        let html = `<p><strong>Câu ${i + 1}: ${q.text}</strong></p>`;

        if (q.type === 'mcq') {
          q.options.forEach((opt, j) => {
            html += `
              <div class="form-check">
                <input class="form-check-input" type="radio" name="q${i}" value="${opt}" id="q${i}_o${j}">
                <label class="form-check-label" for="q${i}_o${j}">${opt}</label>
              </div>
            `;
          });
        } else if (q.type === 'essay') {
          html += `<textarea class="form-control" name="q${i}" rows="4"></textarea>`;
        }

        qDiv.innerHTML = html;
        list.appendChild(qDiv);
      });
    }

    document.getElementById('examForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const answers = [];
      examData.questions.forEach((q, i) => {
        const input = document.querySelector(`[name='q${i}']`);
        let value = '';

        if (q.type === 'mcq') {
          const selected = document.querySelector(`[name='q${i}']:checked`);
          value = selected ? selected.value : '';
        } else if (q.type === 'essay') {
          value = input ? input.value : '';
        }
        answers.push({ question: q.text, answer: value });
      });

      const submission = {
        name: document.getElementById('studentName').value.trim(),
        id: document.getElementById('studentID').value.trim(),
        email: document.getElementById('studentEmail').value.trim(),
        exam: examFile,
        submittedAt: new Date().toISOString(),
        answers
      };

      const key = `exam_result_${examFile}`;
      const existing = JSON.parse(localStorage.getItem(key) || '[]');
      existing.push(submission);
      localStorage.setItem(key, JSON.stringify(existing));

      alert('✅ Bài làm đã được nộp!');
      window.location.href = 'index.html';
    });

    loadExam();
  </script>
</body>
</html>
