<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý Bài Kiểm Tra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Quản Lý Bài Kiểm Tra</h1>
    <button class="btn btn-primary" onclick="login()">Đăng nhập giáo viên</button>

    <div id="exam-list" class="mt-4"></div>
  </div>

  <script>
    // Hàm đăng nhập
    function login() {
      const password = prompt("Nhập mật khẩu giáo viên:");
      if (password === "giaovien123") {
        window.location.href = "admin-dashboard.html";  // Chuyển đến trang quản lý
      } else {
        alert("Mật khẩu sai!");
      }
    }

    // Hàm lấy danh sách bài kiểm tra
    fetch('exams/index.json')
      .then(res => res.json())
      .then(data => {
        let examListHtml = '';
        data.forEach(exam => {
          examListHtml += `
            <div class="card mb-3">
              <div class="card-body">
                <h5 class="card-title">${exam.title}</h5>
                <p class="card-text">${exam.description}</p>
                <a href="editor.html?file=${exam.file}" class="btn btn-warning">Chỉnh sửa</a>
              </div>
            </div>
          `;
        });
        document.getElementById('exam-list').innerHTML = examListHtml;
      });
  </script>
</body>
</html>
