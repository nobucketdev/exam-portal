<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang bài kiểm tra</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <h1 class="mb-4 text-center">📘 Danh Sách Bài Kiểm Tra</h1>
    <div id="assignmentList" class="row g-3 mb-5"></div>

    <div class="text-center">
      <button class="btn btn-outline-primary" onclick="showTeacherLogin()">🔐 Đăng nhập Giáo viên</button>
    </div>

    <!-- Modal đăng nhập -->
    <div class="modal fade" id="teacherModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Đăng nhập giáo viên</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="password" id="teacherPassword" class="form-control" placeholder="Nhập mật khẩu">
          </div>
          <div class="modal-footer">
            <button class="btn btn-primary" onclick="verifyTeacher()">Xác nhận</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const PASSWORD = "giaovien123";

    function loadAssignments() {
      return fetch("exams/index.json").then(res => res.json());
    }

    function showTeacherLogin() {
      const modal = new bootstrap.Modal(document.getElementById('teacherModal'));
      modal.show();
    }

    function verifyTeacher() {
      const pass = document.getElementById('teacherPassword').value;
      if (pass === PASSWORD) {
        window.location.href = "admin.html";
      } else {
        alert("Sai mật khẩu!");
      }
    }

    async function renderAssignments() {
      const list = document.getElementById('assignmentList');
      const assignments = await loadAssignments();
      list.innerHTML = '';
      assignments.forEach((a) => {
        const col = document.createElement('div');
        col.className = 'col-md-6';
        col.innerHTML = `
          <div class="card">
            <div class="card-body">
              <h5 class="card-title">${a.title}</h5>
              <p class="card-text">${a.description || ''}</p>
              <a href="test.html?exam=${a.file}" class="btn btn-success">Làm bài</a>
            </div>
          </div>
        `;
        list.appendChild(col);
      });
    }

    renderAssignments();
  </script>
</body>
</html>
